plugins {
    id 'java'
}

group = 'org.SpringBoot'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'
    compileOnly group: 'jakarta.servlet.jsp', name: 'jakarta.servlet.jsp-api', version: '4.0.0'
    implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-core', version: '10.1.28'



}

test {
    useJUnitPlatform()
}